name: deploy annotation-web

# Manual, explicit-ref only — this workflow never deploys "whatever is on a
# branch HEAD" implicitly. `ref` must be given every time, and the
# `production` environment (required reviewer, see repo settings) gates the
# `deploy` job before it ever touches SSH credentials or the VPS.
#
# What this workflow does NOT do, on purpose: it never provisions or edits
# Caddy. The reverse-proxy route and TLS certificate already exist; this
# pipeline only ever replaces the running application release behind them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit SHA to build and deploy"
        required: true
        type: string

# Never kill a production deploy midway to start a fresher one — a live
# rollback racing an in-flight activation is exactly how one deploy's
# failure ends up reverting a different, successful one. GitHub's queue
# only protects GitHub's side; the activation script's own flock protects
# against a concurrent MANUAL invocation of it on the host.
concurrency:
  group: annotation-web-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 192.248.184.141
  DEPLOY_USER: deploy
  HEALTH_URL_PUBLIC: https://relationship-fix.192-248-184-141.sslip.io/

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      git_sha: ${{ steps.record.outputs.git_sha }}
      nixpkgs_rev: ${{ steps.record.outputs.nixpkgs_rev }}
      store_path: ${{ steps.record.outputs.store_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build annotation-web-deploy
        id: build
        run: |
          STORE_PATH=$(nix build .#annotation-web-deploy --print-out-paths --no-link)
          echo "store_path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Record provenance facts
        id: record
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          NIXPKGS_REV=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "nixpkgs_rev=$NIXPKGS_REV" >> "$GITHUB_OUTPUT"
          echo "store_path=${{ steps.build.outputs.store_path }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Build record"
            echo "- git_sha: \`$GIT_SHA\`"
            echo "- nixpkgs_rev: \`$NIXPKGS_REV\`"
            echo "- store_path: \`${{ steps.build.outputs.store_path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Exported as a NAR so the deploy job — a separate, environment-gated
      # job that may run on a different runner — doesn't need to rebuild.
      # This job never sees DEPLOY_SSH_PRIVATE_KEY or NIX_SIGNING_SECRET_KEY;
      # both stay scoped to the approval-gated job below.
      - name: Export closure
        run: |
          nix-store -qR "${{ steps.build.outputs.store_path }}" \
            | xargs nix-store --export > closure.nar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: closure
          path: closure.nar
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: closure

      # `--import` (unlike `nix copy --to daemon`) accepts an unsigned NAR
      # from this job's own local, unrestricted-user Nix install — the
      # signature check only applies to the *next* step, which is what
      # actually pushes into the untrusted `deploy` user's target daemon.
      - name: Import closure into this runner's local store
        run: nix-store --import < closure.nar

      - name: Sign the closure for the target daemon
        run: |
          umask 077
          printf '%s\n' "${{ secrets.NIX_SIGNING_SECRET_KEY }}" > /tmp/signing.key
          nix store sign --key-file /tmp/signing.key "${{ needs.build.outputs.store_path }}"
          shred -u /tmp/signing.key

      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          # printf '%s\n', not '%s': an OpenSSH private key file without its
          # trailing newline fails to parse ("invalid format" / "error in
          # libcrypto" depending on the client build) — reproduced locally
          # against the VPS's own sshd before landing this fix.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # deploy@ is not a Nix trusted-user — this succeeds only because the
      # path was signed above with a key already in the VPS's
      # trusted-public-keys. See docs/runbooks/ (or the deploy-setup notes)
      # for why that's the deliberate choice over widening trusted-users.
      - name: nix copy to the VPS
        run: |
          nix copy --to ssh-ng://${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "${{ needs.build.outputs.store_path }}"

      # The activation script comes out of the closure we just copied, not from
      # a copy living on the VPS. That is the whole point: one store path
      # carries the server, the migrator and the script that sequences them, so
      # a release cannot be activated by some other release's choreography or
      # migrated by some other release's migrator.
      #
      # It quiesces the service, verifies and backs up the database, migrates,
      # verifies again, activates, health-checks, and on failure puts both the
      # database and the previous release back. It stops short of exactly one
      # thing: if rows were written to the new schema before the health check
      # failed, restoring the backup would destroy them, so it refuses and asks
      # for a person (exit 14). Never touches Caddy.
      - name: Activate new release
        id: activate
        run: |
          set +e
          OUTPUT=$(ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "${{ needs.build.outputs.store_path }}/bin/annotation-web-activate" \
            "${{ needs.build.outputs.store_path }}" \
            "${{ needs.build.outputs.git_sha }}" 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "activate_status=$STATUS"
            echo "$OUTPUT" | grep -E '^(activated_store_path|previous_store_path|generation|local_health|rollback_performed|rolled_back_to|outcome|release_identity|db_path|backup_path|backup_verified|pre_migration_integrity|migration|post_migration_schema|post_activation_writes|db_restored|operator_required)='
          } >> "$GITHUB_OUTPUT"
          exit $STATUS

      # Exit 14 is the one outcome that leaves the service down on purpose and
      # cannot be resolved by re-running anything. It deserves to be impossible
      # to miss in the run summary rather than one line in a wall of log.
      - name: Flag an outcome that needs a person
        if: always() && steps.activate.outputs.activate_status == '14'
        run: |
          {
            echo "## Deployment stopped and needs an operator"
            echo
            echo "The new release was activated, became reachable, failed its health check,"
            echo "and rows were written to the database in between. The pre-migration backup"
            echo "no longer describes the database, so restoring it would discard a"
            echo "respondent's answers. Nothing was restored automatically and the service is"
            echo "stopped."
            echo
            echo "- database: \`${{ steps.activate.outputs.db_path }}\`"
            echo "- pre-migration backup: \`${{ steps.activate.outputs.backup_path }}\`"
            echo "- unhealthy release: \`${{ needs.build.outputs.store_path }}\`"
            echo "- previous release: \`${{ steps.activate.outputs.previous_store_path }}\`"
            echo
            echo "See docs/runbooks/annotation-web-deploy.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Public HTTPS health check
        id: public_health
        if: always()
        run: |
          if curl -sf --max-time 8 "${{ env.HEALTH_URL_PUBLIC }}" > /dev/null; then
            echo "public_health=ok" >> "$GITHUB_OUTPUT"
          else
            echo "public_health=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Deployment record
        if: always()
        run: |
          {
            echo "### Deployment record"
            echo "- git_sha: \`${{ needs.build.outputs.git_sha }}\`"
            echo "- nixpkgs_rev: \`${{ needs.build.outputs.nixpkgs_rev }}\`"
            echo "- built_store_path: \`${{ needs.build.outputs.store_path }}\`"
            echo "- previous_store_path: \`${{ steps.activate.outputs.previous_store_path }}\`"
            echo "- activated_store_path: \`${{ steps.activate.outputs.activated_store_path }}\`"
            echo "- deployment_timestamp: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo "- local_health: \`${{ steps.activate.outputs.local_health }}\`"
            echo "- public_health: \`${{ steps.public_health.outputs.public_health }}\`"
            echo "- outcome: \`${{ steps.activate.outputs.outcome }}\`"
            echo "- activate_status: \`${{ steps.activate.outputs.activate_status }}\`"
            echo ""
            echo "Schema:"
            echo "- release_identity: \`${{ steps.activate.outputs.release_identity }}\`"
            echo "- pre_migration_integrity: \`${{ steps.activate.outputs.pre_migration_integrity }}\`"
            echo "- backup_path: \`${{ steps.activate.outputs.backup_path }}\`"
            echo "- backup_verified: \`${{ steps.activate.outputs.backup_verified }}\`"
            echo "- migration: \`${{ steps.activate.outputs.migration }}\`"
            echo "- post_migration_schema: \`${{ steps.activate.outputs.post_migration_schema }}\`"
            echo ""
            echo "Rollback:"
            echo "- rollback_performed: \`${{ steps.activate.outputs.rollback_performed }}\`"
            echo "- rolled_back_to: \`${{ steps.activate.outputs.rolled_back_to }}\`"
            echo "- db_restored: \`${{ steps.activate.outputs.db_restored }}\`"
            echo "- post_activation_writes: \`${{ steps.activate.outputs.post_activation_writes }}\`"
            echo "- operator_required: \`${{ steps.activate.outputs.operator_required }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
