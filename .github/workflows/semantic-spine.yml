name: semantic-spine

# Экспериментальный harness (experiments/semantic-spine). Он не участвует в
# сборке продукта и ничего не деплоит, но у него есть право падать, и это его
# основная работа.
#
# Триггеры шире самого каталога намеренно. Spine объявляет рёбра в настоящие
# файлы репозитория: заголовок протокола, символ в C#/Haskell, хэш замороженного
# пилотного артефакта. Если такой файл переименовали, а ребро осталось — ссылка
# умерла, и узнать об этом должен CI, а не будущий агент, который прочитает
# оборванную ссылку и уверенно соврёт.
#
# Красный job на «безобидной» правке документации — это НЕ ложное срабатывание.
# Он называет ровно ту ссылку, которая перестала разрешаться. Лечится либо
# правкой ссылки в spec/, либо удалением ребра, если связь действительно умерла.
on:
  push:
    paths:
      - 'experiments/semantic-spine/**'
      - 'data/ontology/**'
      - 'data/pilot/v0.1/**'
      - 'docs/annotation-protocol-v0.md'
      - 'docs/item-authoring-v0.1.md'
      - 'docs/research/dialogue-naturalness-gate.md'
      - 'src/RelationshipFix.Domain/Ontology/**'
      - 'src/RelationshipFix.Evaluation/Ontology/**'
      - 'src/RelationshipFix.Evaluation/Slice/**'
      - 'src/annotation-web/src/Domain.hs'
      - 'src/annotation-web/test/PilotSpec.hs'
      - 'tests/RelationshipFix.DataContracts.Tests/**'
      - '.github/workflows/semantic-spine.yml'
  pull_request:
    paths:
      - 'experiments/semantic-spine/**'
      - 'data/ontology/**'
      - 'data/pilot/v0.1/**'
      - 'docs/annotation-protocol-v0.md'
      - 'docs/item-authoring-v0.1.md'
      - 'docs/research/dialogue-naturalness-gate.md'
      - 'src/RelationshipFix.Domain/Ontology/**'
      - 'src/RelationshipFix.Evaluation/Ontology/**'
      - 'src/RelationshipFix.Evaluation/Slice/**'
      - 'src/annotation-web/src/Domain.hs'
      - 'src/annotation-web/test/PilotSpec.hs'
      - 'tests/RelationshipFix.DataContracts.Tests/**'
      - '.github/workflows/semantic-spine.yml'

jobs:
  semantic-spine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/semantic-spine
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      # fetch-depth: 0 обязателен. Задачи объявляют base_commit, и harness
      # раскладывает его в отдельный git worktree. При shallow checkout коммит
      # недоступен, и прогон падает — намеренно, а не откатывается на рабочее
      # дерево: тихий откат вернул бы невоспроизводимость, ради которой всё это
      # и переделывалось.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Контекст `runner` недоступен в jobs.<job_id>.env — workflow с таким
      # ключом падает мгновенно, не создав ни одного job'а. Поэтому переменная
      # выставляется шагом: $GITHUB_ENV виден всем последующим шагам.
      - name: Configure the worktree cache
        run: echo "SPINE_WORKTREE_DIR=$RUNNER_TEMP/spine-worktrees" >> "$GITHUB_ENV"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Сгенерированные артефакты закоммичены. Если они разошлись со spec,
      # значит кто-то правил JSON руками или забыл перекомпилировать.
      - name: Generated artifacts are current
        run: uv run --no-project python -m spine compile --check

      # Fail-closed проверки против настоящего репозитория.
      - name: Verify the spine
        run: uv run --no-project python -m spine verify

      # Пока spec не source of truth, единственное, что делает эксперимент
      # осмысленным, — доказуемое равенство с production-онтологией.
      - name: compile(spec) == behavior-v0.1 subset
        run: uv run --no-project python -m spine equivalence

      # Включая мутационный набор: каждая проверка обязана кусаться.
      - name: Harness tests
        run: uv run --no-project python -m unittest discover -t . -s tests -v

      # Subject приколочен к base_commit, поэтому числа больше не зависят от
      # содержимого текущего дерева — и байт-равенство снова осмысленно.
      # Раньше здесь стояла проверка на выводы, потому что проверять цифры было
      # нельзя: любой новый файл в репозитории их двигал.
      - name: Frozen selection results reproduce byte for byte
        run: |
          for budget in 2000 4000 8000 16000; do
            uv run --no-project python eval/score.py --budget "$budget" \
              --out "$RUNNER_TEMP/fresh-$budget.json"
            if ! cmp -s "$RUNNER_TEMP/fresh-$budget.json" "eval/results/selection-$budget.json"; then
              echo "::error::selection results at budget $budget no longer reproduce"
              diff <(python3 -m json.tool "eval/results/selection-$budget.json") \
                   <(python3 -m json.tool "$RUNNER_TEMP/fresh-$budget.json") | head -40
              exit 1
            fi
          done
          echo "frozen results reproduce at every budget"
