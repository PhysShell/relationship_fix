name: annotation-web

on:
  push:
    paths:
      - 'src/annotation-web/**'
      - '.github/workflows/annotation-web.yml'
  pull_request:
    paths:
      - 'src/annotation-web/**'
      - '.github/workflows/annotation-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/annotation-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Generate templ
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - name: Tidy
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
