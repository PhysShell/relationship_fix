name: annotation-web

# Two independent judges of two independent halves. The Haskell job proves the
# instrument; the Python job proves the research tooling that seals packages
# and issues people. Both read data/pilot, data/ontology and the instruction
# document, so a change to any of those wakes both: a sealed package whose
# tests only ran on the author's machine is not evidence.
on:
  push:
    paths:
      - 'src/annotation-web/**'
      - 'deploy/**'
      - 'research/python/**'
      - 'data/pilot/**'
      - 'data/ontology/**'
      - 'docs/pilot-v0.1-instructions.md'
      - '.github/workflows/annotation-web.yml'
  pull_request:
    paths:
      - 'src/annotation-web/**'
      - 'deploy/**'
      - 'research/python/**'
      - 'data/pilot/**'
      - 'data/ontology/**'
      - 'docs/pilot-v0.1-instructions.md'
      - '.github/workflows/annotation-web.yml'

jobs:
  # The research tooling: validate_items, materialize (exact-equality gate,
  # seal), issuance (external eligibility, token once), agreement, the
  # Catalog-vs-dogfood-yaml cross-check. Stdlib-only apart from the
  # human-interface group (openpyxl), which is installed so the xlsx tests run
  # instead of skipping. The canonical runner is uv with the committed lock.
  research-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/python
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: research/python/uv.lock

      - name: Sync from the committed lock
        run: uv sync --locked --group human-interface

      - name: Research Python tests
        run: uv run --group human-interface python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/annotation-web
    steps:
      - uses: actions/checkout@v4

      - name: Enforce no-JS source invariant
        run: |
          if grep -RniE '<script[ >]|src=[^ ]*\.js|javascript:' app export migrate src test; then
            echo 'Client-side JavaScript detected in annotation-web source.' >&2
            exit 1
          fi
          if find app export migrate src test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | grep -q .; then
            echo 'JavaScript/TypeScript source files detected in annotation-web.' >&2
            exit 1
          fi

      # yesod-core's toWaiApp bakes in an unconditional request logger that
      # writes every request path -- bearer tokens in /t/<token> included --
      # to stdout in cleartext. The fix (toWaiAppPlain + reapplying
      # defaultMiddlewaresNoLogging by hand) is one import and one line;
      # nothing stops a future "cleanup" from quietly reverting to the
      # one-liner that looks equivalent and silently reopens the leak. This
      # only inspects non-comment lines, so mentioning toWaiApp in prose
      # (like this very check's own error message) does not self-trigger.
      - name: Enforce no-request-logging-middleware invariant
        run: |
          if grep -nE '\btoWaiApp\b' app/Main.hs | grep -vE '^[0-9]+:[[:space:]]*--' | grep -q .; then
            echo 'app/Main.hs must build the WAI application via toWaiAppPlain + defaultMiddlewaresNoLogging, not toWaiApp: the latter logs every request path, bearer tokens included, in cleartext.' >&2
            exit 1
          fi

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: 'latest'
          cabal-update: false

      - name: Cache Stack artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            src/annotation-web/.stack-work
          key: stack-${{ runner.os }}-ghc9.10.3-${{ hashFiles('src/annotation-web/stack.yaml.lock', 'src/annotation-web/relationship-fix-annotation-web.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-ghc9.10.3-

      - name: Build and test
        run: stack build --system-ghc --pedantic --test

      # The deployment choreography, exercised against a fake host: nine ways a
      # schema-changing release can go wrong, including the two that must not
      # roll the database back. It runs the real binaries and the real
      # activate.sh; only the systemd/nix-profile adapter is swapped.
      #
      # TMPDIR is pinned to the runner's temp so the harness can hard-link the
      # binaries into its fake releases instead of copying 48 MB seventeen
      # times.
      - name: Deployment acceptance matrix
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          command -v sqlite3 >/dev/null || sudo apt-get install -y sqlite3
          ../../deploy/test/matrix.sh "$(stack path --system-ghc --local-install-root)/bin"
