name: annotation-web

on:
  push:
    paths:
      - 'src/annotation-web/**'
      - '.github/workflows/annotation-web.yml'
  pull_request:
    paths:
      - 'src/annotation-web/**'
      - '.github/workflows/annotation-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/annotation-web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: 'latest'
          cabal-update: false
      - name: Enforce no-JS source invariant
        run: |
          if grep -RniE '<script[ >]|src=.*\.js' app src test; then
            echo 'Client-side JavaScript detected in annotation-web source.' >&2
            exit 1
          fi
      - name: Test
        run: stack test --system-ghc --pedantic
      - name: Build
        run: stack build --system-ghc --pedantic
