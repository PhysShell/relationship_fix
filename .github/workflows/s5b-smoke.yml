# Дымовая проба формы прогона на НАСТОЯЩЕМ раннере.
#
# Зачем отдельно от научного прогона: все оценки длительности сняты на
# машине разработчика. Сравнивать их с шестичасовым потолком GitHub —
# значит выдавать бенчмарк машины A за время исполнения машины B. Поэтому
# самый тяжёлый production-shaped юнит гоняется здесь как есть, и
# записываются wall time, пиковый RSS и дайджест.
#
# ЧТО ИМЕННО СРАВНИВАЕТСЯ. Оценки сняты здесь:
#
#   4 x Intel Xeon @ 2.10GHz, 15 ГБ RAM, Python 3.11.15
#
# Публичный ubuntu-latest сейчас даёт 4 CPU / 16 ГБ / 14 ГБ SSD — близко по
# форме, но НЕ то же железо. Поэтому задание печатает свой паспорт рядом с
# `predicted_hours`, и расхождение видно числом, а не предполагается.
#
# Версии действий сверены со страницами релизов, а не взяты по памяти:
# checkout v7, setup-python v7, upload-artifact v7. Мажоры разошлись.
name: S5b smoke

# ЗАПУСК ПО ФАЙЛУ-ЗАЯВКЕ, А НЕ ПО КАЖДОМУ КОММИТУ.
#
# `workflow_dispatch` здесь бесполезен, и это documented: «This event will
# only trigger a workflow run if the workflow file exists on the default
# branch». Файл лежит на рабочей ветке, дефолтная другая.
#
# У `push` такого ограничения нет: файл берётся ИЗ ОБНОВЛЁННОГО РЕФА.
# Поэтому триггер — `push`, но сужен до одного файла-заявки: задание идёт
# почти шесть часов, и срабатывать на каждую правку соседнего кода оно не
# должно. Чтобы заказать прогон, меняется `.github/s5b-smoke-request.txt`,
# и его содержимое объясняет, зачем прогон заказан.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/s5b-smoke-request.txt'

permissions:
  contents: read

jobs:
  worst-case-unit:
    runs-on: ubuntu-latest
    # Потолок задания на GitHub-hosted раннере — 6 часов. Сознательно ниже:
    # упереться в платформенный потолок значит потерять ВСЮ работу задания
    # без диагностики, а так оно падает само и с отчётом.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Паспорт раннера
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          python3 -VV
      - name: Самый дорогой юнит сетки
        working-directory: research/python
        env:
          PYTHONPATH: .
        run: python3 -B -m tools.s5b_stage1_cli smoke --out ../../out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-smoke
          path: out/smoke.json
