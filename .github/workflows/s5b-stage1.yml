# Этап 1: план -> вычисление по шардам -> fail-closed слияние.
#
# ФОРМА ЗАДАНА ДОКУМЕНТИРОВАННЫМИ ПРЕДЕЛАМИ, а не вкусом:
#
#   матрица максимум 256 заданий на прогон  -> юниты группируются в шарды,
#     потому что на третьей ступени их 189, а было бы и больше;
#   задание максимум 6 часов                -> бюджет шарда 4 часа, и план
#     ОТКАЗЫВАЕТ до запуска, если раскладка в него не укладывается.
#
# Результаты шардов идут ТОЛЬКО через артефакты. Поведение `outputs` у
# матричных заданий в документации не описано, поэтому конструкция на него
# не опирается вовсе — это дешевле, чем полагаться на неописанное.
#
# Имена артефактов несут значение матрицы: начиная с v4 они обязаны быть
# уникальными в пределах задания, и артефакт неизменяем после создания.
name: S5b stage 1

on:
  workflow_dispatch:
    inputs:
      look:
        description: ступень лестницы
        required: true
        type: choice
        options: ['4000', '16000', '64000']

permissions:
  contents: read

concurrency:
  group: s5b-stage1-${{ inputs.look }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: plan
        working-directory: research/python
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          PLAN=$(python3 -B -m tools.s5b_stage1_cli plan \
                   --look ${{ inputs.look }} --out ../../out)
          echo "$PLAN"
          echo "shards=$(echo "$PLAN" | python3 -c \
            'import json,sys; print(json.dumps(json.load(sys.stdin)["shards"]))')" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-manifest-${{ inputs.look }}
          path: out/manifest.json

  compute:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Упавший шард НЕ ДОЛЖЕН отменять остальные: слияние и так
      # fail-closed и само сообщит, чего не хватает, а посчитанное
      # переиспользуется по стабильному task_id.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - working-directory: research/python
        env:
          PYTHONPATH: .
        run: |
          python3 -B -m tools.s5b_stage1_cli run \
            --look ${{ inputs.look }} --shard ${{ matrix.shard }} \
            --out ../../out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-shard-${{ inputs.look }}-${{ matrix.shard }}
          path: out/*.json

  merge:
    needs: [plan, compute]
    # Даже если часть шардов упала: слияние обязано СКАЗАТЬ, чего не
    # хватает, а не молча не запуститься.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: s5b-shard-${{ inputs.look }}-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: s5b-manifest-${{ inputs.look }}
          path: out
      - working-directory: research/python
        env:
          PYTHONPATH: .
        run: python3 -B -m tools.s5b_stage1_cli merge \
               --look ${{ inputs.look }} --out ../../out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-stage1-${{ inputs.look }}
          path: out
