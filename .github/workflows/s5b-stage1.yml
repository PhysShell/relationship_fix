# Лестница S5b. Наука и исполнение приезжают РАЗНЫМИ checkout'ами.
#
#   SCIENCE_SHA    генератор, критерий точности, s5b_shard.merge,
#                  cell_contrast — заморожено, все ступени считают одно
#   EXECUTION_SHA  планировщик, стоимость, реестр tau, сведение
#   github.sha     коммит-заявка, только сигнал к запуску
#
# Граница физическая: поправить науку, правя планировщик, технически
# нельзя — файлы приходят из разных коммитов.
name: S5b ladder

on:
  push:
    branches: ['claude/**']
    paths: ['.github/s5b-stage1-request.txt']

permissions:
  contents: read
  # нужно, чтобы скачать артефакты ПРОШЛОЙ ступени из другого прогона
  actions: read

env:
  SCIENCE_SHA: "7a62a3911f8bc000cf08ad97f76c0f962b07e615"
  EXECUTION_SHA: "a9cbc942f215d963dcc849bfbbbda9b976002300"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      look: ${{ steps.request.outputs.look }}
      prior_look: ${{ steps.request.outputs.prior_look }}
      prior_run: ${{ steps.request.outputs.prior_run }}
      prior_digest: ${{ steps.request.outputs.prior_digest }}
      resume_run: ${{ steps.request.outputs.resume_run }}
      resume_run_2: ${{ steps.request.outputs.resume_run_2 }}
      resume_run_3: ${{ steps.request.outputs.resume_run_3 }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: request
          # нужна история, иначе diff пин..заявка не построить
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: request
        run: |
          set -euo pipefail
          FILE=request/.github/s5b-stage1-request.txt
          LOOK=$(grep -oP '^look:\s*\K[0-9]+' "$FILE" | head -1)
          PRIOR_LOOK=$(grep -oP '^prior_look:\s*\K[0-9]+' "$FILE" | head -1 || true)
          PRIOR_RUN=$(grep -oP '^prior_run:\s*\K[0-9]+' "$FILE" | head -1 || true)
          PRIOR_DIGEST=$(grep -oP '^prior_digest:\s*\K[0-9a-f]+' "$FILE" | head -1 || true)
          # ЦЕПОЧКА, А НЕ ОДНА ОСТАНОВКА. Прогон-продолжение объявляет
          # ОСТАТОК, поэтому указать на него одного мало: работа ещё более
          # раннего прогона тогда не видна и считается заново. Проверено
          # запуском: трёхчастная цепочка планировала 102 юнита вместо 71.
          # Первый в списке — тот, что объявил ступень ЦЕЛИКОМ: его
          # манифест и берётся. Потолок три: ступень, пережившая больше
          # трёх остановок, должна планироваться заново, а не склеиваться.
          RESUME_RUNS=$(grep -oP '^resume_run:\s*\K[0-9 ]+' "$FILE" | head -1 | xargs || true)
          set -- $RESUME_RUNS
          if [ "$#" -gt 3 ]; then
            echo "resume_run: не больше трёх прогонов, получено $#" >&2
            exit 1
          fi
          echo "resume_run=${1:-}" >> "$GITHUB_OUTPUT"
          echo "resume_run_2=${2:-}" >> "$GITHUB_OUTPUT"
          echo "resume_run_3=${3:-}" >> "$GITHUB_OUTPUT"
          PIN=$(grep -oP '^execution_pin:\s*\K[0-9a-f]{40}' "$FILE" | head -1)
          WF=$(grep -oP '^workflow_sha256:\s*\K[0-9a-f]{64}' "$FILE" | head -1)
          if [ -z "$PIN" ] || [ -z "$WF" ]; then
            echo "заявка обязана нести execution_pin и workflow_sha256" >&2
            exit 1
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "workflow_sha256=$WF" >> "$GITHUB_OUTPUT"
          case "$LOOK" in
            4000|16000|64000) ;;
            *) echo "ступень $LOOK не из лестницы" >&2; exit 1 ;;
          esac
          if [ "$LOOK" != "4000" ] && { [ -z "$PRIOR_LOOK" ] || [ -z "$PRIOR_RUN" ] \
               || [ -z "$PRIOR_DIGEST" ]; }; then
            echo "ступень $LOOK требует prior_look, prior_run и prior_digest" >&2
            exit 1
          fi
          echo "look=$LOOK" >> "$GITHUB_OUTPUT"
          echo "prior_look=$PRIOR_LOOK" >> "$GITHUB_OUTPUT"
          echo "prior_run=$PRIOR_RUN" >> "$GITHUB_OUTPUT"
          echo "prior_digest=$PRIOR_DIGEST" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.request.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          pattern: s5b-shard-${{ steps.request.outputs.prior_look }}-*
          merge-multiple: true
          run-id: ${{ steps.request.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.request.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          name: s5b-manifest-${{ steps.request.outputs.prior_look }}
          run-id: ${{ steps.request.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.request.outputs.resume_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ steps.request.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ steps.request.outputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.request.outputs.resume_run_2 != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ steps.request.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ steps.request.outputs.resume_run_2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.request.outputs.resume_run_3 != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ steps.request.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ steps.request.outputs.resume_run_3 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # манифест — ТОЛЬКО от первого прогона цепочки: он объявил ступень
      # целиком, остальные объявляли остаток
      - if: ${{ steps.request.outputs.resume_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          name: s5b-manifest-${{ steps.request.outputs.look }}
          run-id: ${{ steps.request.outputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          PYTHONPATH: science/research/python:exec/execution
          SCIENCE_SHA: ${{ env.SCIENCE_SHA }}
          EXECUTION_SHA: ${{ env.EXECUTION_SHA }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          PRIOR=""
          if [ -n "${{ steps.request.outputs.prior_run }}" ]; then
            PRIOR="--prior prior"
          fi
          if [ -n "${{ steps.request.outputs.resume_run }}" ]; then
            PRIOR="$PRIOR --resume resumed"
          fi
          OUT=$(python3 -B -m s5b_execution.cli plan \
                  --look ${{ steps.request.outputs.look }} $PRIOR \
                  --prior-run "${{ steps.request.outputs.prior_run }}" \
                  --prior-digest "${{ steps.request.outputs.prior_digest }}" \
                  --repo request --pin "${{ steps.request.outputs.pin }}" \
                  --workflow request/.github/workflows/s5b-stage1.yml \
                  --workflow-sha256 "${{ steps.request.outputs.workflow_sha256 }}" \
                  --science science/research/python --out out)
          echo "$OUT"
          echo "shards=$(echo "$OUT" | python3 -c \
            'import json,sys; print(json.dumps(json.load(sys.stdin)["shards"]))')" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-manifest-${{ steps.request.outputs.look }}
          path: out/manifest.json

  compute:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # НЕ ЗАБИРАТЬ ВЕСЬ ОБЩИЙ РЕСУРС. Предел одновременных заданий даётся
      # на ПЛАН, а не на репозиторий (Free 20, Pro 40), и 23 сентября 41
      # задание S5b заняло все 20 слотов аккаунта: пилот в соседнем
      # репозитории простоял в очереди, не начавшись. max-parallel
      # ограничивает одновременность ВНУТРИ этой матрицы — «will run a
      # maximum of two jobs at a time, even if there are runners available
      # to run all six jobs at once» (docs GitHub).
      #
      # Литерал, а не выражение: поддержку выражений документация не
      # утверждает, а опираться на непроверенную возможность здесь нечего.
      # Совпадение с cost.MAX_PARALLEL держит гейт.
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: s5b-manifest-${{ needs.plan.outputs.look }}
          path: plan
      - env:
          PYTHONPATH: science/research/python:exec/execution
        run: |
          python3 -B -c "import sys; sys.path[:0] = \
            'science/research/python:exec/execution'.split(':'); \
            from s5b_execution.guard import assert_science_comes_from as g; \
            print(g('science/research/python'))"
          python3 -B -m s5b_execution.cli run \
            --look ${{ needs.plan.outputs.look }} \
            --manifest plan/manifest.json \
            --shard ${{ matrix.shard }} --out out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-shard-${{ needs.plan.outputs.look }}-${{ matrix.shard }}
          path: out

  reduce:
    needs: [plan, compute]
    # Даже если часть шардов упала: сведение обязано СКАЗАТЬ, чего не
    # хватает, а не молча не запуститься.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: s5b-shard-${{ needs.plan.outputs.look }}-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: s5b-manifest-${{ needs.plan.outputs.look }}
          path: out
      - if: ${{ needs.plan.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          pattern: s5b-shard-${{ needs.plan.outputs.prior_look }}-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.plan.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          name: s5b-manifest-${{ needs.plan.outputs.prior_look }}
          run-id: ${{ needs.plan.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.plan.outputs.resume_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ needs.plan.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.plan.outputs.resume_run_2 != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ needs.plan.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.resume_run_2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.plan.outputs.resume_run_3 != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          pattern: s5b-shard-${{ needs.plan.outputs.look }}-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.resume_run_3 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # манифест — ТОЛЬКО от первого прогона цепочки
      - if: ${{ needs.plan.outputs.resume_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: resumed
          name: s5b-manifest-${{ needs.plan.outputs.look }}
          run-id: ${{ needs.plan.outputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PYTHONPATH: science/research/python:exec/execution
          SCIENCE_SHA: ${{ env.SCIENCE_SHA }}
          EXECUTION_SHA: ${{ env.EXECUTION_SHA }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          PRIOR=""
          if [ -n "${{ needs.plan.outputs.prior_run }}" ]; then
            PRIOR="--prior prior"
          fi
          if [ -n "${{ needs.plan.outputs.resume_run }}" ]; then
            PRIOR="$PRIOR --resume resumed"
          fi
          python3 -B -m s5b_execution.cli reduce \
            --look ${{ needs.plan.outputs.look }} $PRIOR \
            --prior-run "${{ needs.plan.outputs.prior_run }}" \
            --prior-digest "${{ needs.plan.outputs.prior_digest }}" \
            --science science/research/python --out out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-reduced-${{ needs.plan.outputs.look }}
          path: |
            out/reduced.json
            out/checkpoint.json
