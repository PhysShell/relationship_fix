# Лестница S5b. Наука и исполнение приезжают РАЗНЫМИ checkout'ами.
#
#   SCIENCE_SHA    генератор, критерий точности, s5b_shard.merge,
#                  cell_contrast — заморожено, все ступени считают одно
#   EXECUTION_SHA  планировщик, стоимость, реестр tau, сведение
#   github.sha     коммит-заявка, только сигнал к запуску
#
# Граница физическая: поправить науку, правя планировщик, технически
# нельзя — файлы приходят из разных коммитов.
name: S5b ladder

on:
  push:
    branches: ['claude/**']
    paths: ['.github/s5b-stage1-request.txt']

permissions:
  contents: read
  # нужно, чтобы скачать артефакты ПРОШЛОЙ ступени из другого прогона
  actions: read

env:
  SCIENCE_SHA: "7a62a3911f8bc000cf08ad97f76c0f962b07e615"
  EXECUTION_SHA: "0000000000000000000000000000000000000000"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      look: ${{ steps.request.outputs.look }}
      prior_look: ${{ steps.request.outputs.prior_look }}
      prior_run: ${{ steps.request.outputs.prior_run }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: request
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: request
        run: |
          set -euo pipefail
          FILE=request/.github/s5b-stage1-request.txt
          LOOK=$(grep -oP '^look:\s*\K[0-9]+' "$FILE" | head -1)
          PRIOR_LOOK=$(grep -oP '^prior_look:\s*\K[0-9]+' "$FILE" | head -1 || true)
          PRIOR_RUN=$(grep -oP '^prior_run:\s*\K[0-9]+' "$FILE" | head -1 || true)
          case "$LOOK" in
            4000|16000|64000) ;;
            *) echo "ступень $LOOK не из лестницы" >&2; exit 1 ;;
          esac
          if [ "$LOOK" != "4000" ] && { [ -z "$PRIOR_LOOK" ] || [ -z "$PRIOR_RUN" ]; }; then
            echo "ступень $LOOK требует prior_look и prior_run" >&2
            exit 1
          fi
          echo "look=$LOOK" >> "$GITHUB_OUTPUT"
          echo "prior_look=$PRIOR_LOOK" >> "$GITHUB_OUTPUT"
          echo "prior_run=$PRIOR_RUN" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.request.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          pattern: s5b-shard-${{ steps.request.outputs.prior_look }}-*
          merge-multiple: true
          run-id: ${{ steps.request.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.request.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          name: s5b-manifest-${{ steps.request.outputs.prior_look }}
          run-id: ${{ steps.request.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          PYTHONPATH: science/research/python:exec/execution
          SCIENCE_SHA: ${{ env.SCIENCE_SHA }}
          EXECUTION_SHA: ${{ env.EXECUTION_SHA }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          PRIOR=""
          if [ -n "${{ steps.request.outputs.prior_run }}" ]; then
            PRIOR="--prior prior"
          fi
          OUT=$(python3 -B -m s5b_execution.cli plan \
                  --look ${{ steps.request.outputs.look }} $PRIOR --out out)
          echo "$OUT"
          echo "shards=$(echo "$OUT" | python3 -c \
            'import json,sys; print(json.dumps(json.load(sys.stdin)["shards"]))')" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-manifest-${{ steps.request.outputs.look }}
          path: out/manifest.json

  compute:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: s5b-manifest-${{ needs.plan.outputs.look }}
          path: plan
      - env:
          PYTHONPATH: science/research/python:exec/execution
        run: |
          python3 -B -m s5b_execution.cli run \
            --look ${{ needs.plan.outputs.look }} \
            --manifest plan/manifest.json \
            --shard ${{ matrix.shard }} --out out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-shard-${{ needs.plan.outputs.look }}-${{ matrix.shard }}
          path: out

  reduce:
    needs: [plan, compute]
    # Даже если часть шардов упала: сведение обязано СКАЗАТЬ, чего не
    # хватает, а не молча не запуститься.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXECUTION_SHA }}
          path: exec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: s5b-shard-${{ needs.plan.outputs.look }}-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: s5b-manifest-${{ needs.plan.outputs.look }}
          path: out
      - if: ${{ needs.plan.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          pattern: s5b-shard-${{ needs.plan.outputs.prior_look }}-*
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.plan.outputs.prior_run != '' }}
        uses: actions/download-artifact@v8
        with:
          path: prior
          name: s5b-manifest-${{ needs.plan.outputs.prior_look }}
          run-id: ${{ needs.plan.outputs.prior_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PYTHONPATH: science/research/python:exec/execution
        run: |
          PRIOR=""
          if [ -n "${{ needs.plan.outputs.prior_run }}" ]; then
            PRIOR="--prior prior"
          fi
          python3 -B -m s5b_execution.cli reduce \
            --look ${{ needs.plan.outputs.look }} $PRIOR --out out
      - uses: actions/upload-artifact@v7
        with:
          name: s5b-reduced-${{ needs.plan.outputs.look }}
          path: out/reduced.json
