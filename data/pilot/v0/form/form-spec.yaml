schema_version: rf.form-spec.v1
form_id: tally-kdP6do
form_revision: v6
surface: tally
public_url: https://tally.so/r/kdP6do
status: ux_prototype_not_scientific_run
language_setting: ru
ontology_version_displayed: behavior-v0.2-candidate-inspired-wording
core_items_file: ../items.jsonl
dogfood_items_file: dogfood-v6-items.yaml

purpose: >-
  UX and ontology-boundary dogfood prototype for the annotation protocol. This form is not
  the frozen scientific annotation run and submissions to it MUST NOT be treated as pilot evidence.

canonicality:
  repository_spec_is_source_of_truth: true
  tally_is_render_target: true
  respondent_submissions_are_debug_only: true
  scientific_pilot_items_are_not_modified_by_v6: true

presentation_language:
  question: "Язык предъявления / Presentation language"
  options:
    - ru
    - en
  core_items_1_to_3_policy:
    - show selected-language stimulus
    - where selected display differs from source language, allow optional original reveal
    - record reveal as respondent action
    - prototype translations are machine translations and are not frozen scientific translations
  dogfood_items_4_to_9_policy:
    - RU-only in v6 regardless of the presentation-language choice
    - explicitly marked as dogfood and outside the scientific pilot

intro:
  title: "Relationship Fix — прототип разметки диалогов v6"
  observable_only_rule: >-
    Размечайте только то, что наблюдаемо в предоставленном фрагменте.
    Не угадывайте мотив, характер или намерение человека.
  categories:
    - id: B.BLAME_CRITICISM
      display_ru: "обвинение / критика"
      short_definition_ru: >-
        Партнёру приписывается вина или негативная характеристика личности/устойчивого
        паттерна в целом, а не только описывается конкретный эпизод.
      positive_example_ru: "Ты всегда обо всём забываешь."
      boundary_example_ru: "ну ты дебил 😂❤️"
      boundary_note_ru: "не обязательно label в явно игровом контексте"
    - id: B.PRESSURE_FOR_CHANGE
      display_ru: "давление с требованием измениться"
      short_definition_ru: >-
        Настойчивое или повторное требование изменить поведение, давление либо ультиматум.
      positive_example_ru: "Сколько можно повторять — убери за собой, я серьёзно."
      negative_example_ru: "Можешь завтра забрать посылку?"
    - id: B.VALIDATION
      display_ru: "содержательное признание / понимание переживания или позиции"
      short_definition_ru: >-
        Наблюдаемое признание, понимание или содержательный отклик на чувство, опыт или
        точку зрения партнёра. Согласие с выводами не обязательно. Важен отклик именно
        на переживание или позицию, а не просто сигнал о получении сообщения.
      positive_example_ru: "Понимаю, звучит обидно, я бы тоже разозлилась."
      negative_example_ru: "Понятно."
      negative_note_ru: "само по себе подтверждает получение сообщения, но не переживание"
    - id: B.REPAIR_ATTEMPT
      display_ru: "попытка снизить накал / восстановить взаимодействие"
      short_definition_ru: >-
        Наблюдаемая попытка изменить негативный ход взаимодействия: взять часть ответственности,
        извиниться без немедленной контратаки, предложить начать заново, согласованно поставить
        разговор на паузу или иным способом снизить накал. Кодируется попытка, а не её успех
        и не предполагаемое внутреннее намерение.
      positive_examples_ru:
        - "Прости, я правда затупил. Давай сначала?"
        - "Стоп, мы сейчас только сильнее ругаемся. Давай поедим и вернёмся к этому через час."
      negative_example_ru: "Извини конечно, но это ты всё начала."
    - id: B.AVOIDANCE_TOPIC_SHIFT
      display_ru: "уход / смена поднятой темы"
      short_definition_ru: >-
        Человек остаётся в разговоре, но наблюдаемо уводит его от только что поднятой темы:
        переводит разговор на другое без ответа по существу, отшучивается от содержания или
        неопределённо откладывает обсуждение.
      positive_example_ru: "A: Нам надо поговорить про кредит. B: Кстати, видела новый сериал?"
      negative_example_ru: "Давай вечером, сейчас встреча."
      boundary_notes_ru:
        - "короткий или холодный ответ сам по себе не avoidance"
        - "сама по себе смена темы или любая пауза не avoidance"
        - "согласованная деэскалация или пауза с конкретным возвратом может быть repair, а не avoidance"

epistemic_decision:
  assigned:
    display_ru: "assigned — наблюдается одна или несколько категорий"
  none_observed:
    display_ru: "none_observed — фрагмента достаточно; ни одна категория не наблюдается"
    meaning: sufficient_context_no_active_label_observed
  abstained:
    display_ru: "abstained — недостающий контекст мешает определить, есть категория или нет"
    meaning: missing_information_can_change_classification
    reasons:
      - insufficient_context
      - ambiguous_between_labels
      - unit_not_applicable
      - source_corrupted
      - language_unsupported
      - other

core_evidence_policy:
  applies_to_pages: [2, 3, 4]
  required_for_each_assigned_label: true
  scope: target_message_only
  quote_rule: "самый короткий непрерывный точный фрагмент target message, достаточный для label"
  ui: one_evidence_field_per_selected_label

dogfood_evidence_policy:
  applies_to_pages: [5, 6, 7, 8, 9, 10]
  scope: target_message_only
  ui: one_required_debug_textarea_for_all_selected_labels
  format_hint: "LABEL = «самая короткая точная цитата»"
  rationale: >-
    The v6 dogfood set tests ontology boundaries rather than the already-tested conditional
    evidence-field mechanics. The simplified debug UI avoids duplicating thirty conditional fields.

core_items:
  - item_id: pn-20
    page_number: 2
    source_language: en
    source:
      - author: b
        text: "grabbed the tickets, row 12"
      - author: a
        text: "perfect, thank you!!"
        target: true
    prototype_ru_translation:
      - author: b
        text: "Я взял билеты, 12-й ряд."
      - author: a
        text: "Отлично, спасибо!!"
        target: true

  - item_id: pc-05
    page_number: 3
    source_language: ru
    source:
      - author: a
        text: "Мне было неприятно при всех это слушать."
      - author: b
        text: "Слышу тебя. Я правда перегнул при ребятах, извини."
        target: true
    prototype_en_translation:
      - author: a
        text: "It was unpleasant for me to hear that in front of everyone."
      - author: b
        text: "I hear you. I really went too far in front of the guys, sorry."
        target: true

  - item_id: pc-16
    page_number: 4
    source_language: ru
    source:
      - author: a
        text: "Мне правда тяжело даются эти созвоны с твоими родителями. Я каждый раз потом пустая."
      - author: b
        text: "Ясно."
        target: true
    prototype_en_translation:
      - author: a
        text: "Those calls with your parents are really hard for me. I feel completely drained every time afterwards."
      - author: b
        text: "I see."
        target: true
    item_specific_note_ru: >-
      Короткий или холодный ответ сам по себе не является ни validation, ни avoidance.
      Кодируйте только то, что наблюдаемо в предоставленном фрагменте.

dogfood_set:
  pages: [5, 6, 7, 8, 9, 10]
  source: dogfood-v6-items.yaml
  item_ids:
    - dg-04
    - dg-05
    - dg-06
    - dg-07
    - dg-08
    - dg-09
  scientific_status: debug_only_not_scientific_evidence

logic_contract:
  core_items:
    - selected language controls stimulus presentation
    - original reveal is optional
    - assigned shows active labels and requires at least one
    - each selected label shows and requires one evidence quote
    - abstained shows and requires abstention reason
    - ambiguous_between_labels and other require a note
  dogfood_items:
    - assigned shows and requires active-label selection plus one evidence textarea
    - abstained shows and requires abstention reason plus context-change comment
    - none_observed shows no additional fields

revision_notes:
  from_v4_to_v5:
    - validation reframed as substantive acknowledgement/understanding rather than lexical acknowledgement
    - repair defined as observable attempt to alter a negative interaction trajectory, not merely apology language
    - explicit de-escalation/pause-with-return added as repair example
    - topic shift no longer treated as intrinsically avoidance
    - avoidance contrasted explicitly against repair/de-escalation
  from_v5_to_v6:
    - retain the original three familiar prototype items for continuity and full UX coverage
    - add six fresh RU-only dogfood challenge cases in a separate non-scientific artifact
    - probe concrete causal description vs blame, substantive acknowledgement, bounded pause, playful language, under-contextualized sarcasm, and co-occurring behaviors
    - simplify evidence capture on dogfood pages to one required textarea while preserving exact-quote semantics
    - explicitly prevent dogfood answers from being treated as gold or pilot evidence
  provenance_note: >-
    Wording is informed by behavior-v0.2-candidate and observational-coding prior-art review,
    but this Tally form remains a UX/debug prototype and does not itself validate the adapted constructs.

scientific_run_warning: >-
  Before any real annotator is exposed, replace prototype translations with frozen reviewed
  translations, freeze ontology/instructions/items/presentation, record hashes, and generate
  physically separate blind annotator packages. The Tally v6 prototype and dogfood responses
  do not start that freeze and MUST NOT be mixed with scientific pilot evidence.
