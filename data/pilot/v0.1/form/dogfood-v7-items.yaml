schema_version: rf.dogfood-items.v1
dogfood_id: annotation-ux-v7
status: debug_only_not_scientific_evidence
language: ru
included_in_scientific_pilot: false
lineage:
  derived_from: annotation-ux-v6
  source_yaml: ../v0/form/dogfood-v6-items.yaml
  source_sha256: 4b2cd0bfc2ba4dab87d5ca0d2e79465ed0e3eab01b9411917ae7a5a110daf8a8
  provenance_sidecar: dogfood-v7-provenance.json
  rule: v6 frozen and hash-pinned; changes materialize as this new version; retired ids never reused
  replaces:
    dg-04: dg-10
    dg-09: dg-11
purpose: >-
  Fresh challenge cases for UX/ontology dogfooding after the original three prototype
  items became familiar to the primary tester. These items MUST NOT be merged into
  data/pilot/v0/items.jsonl or treated as gold/pilot evidence.

presentation:
  tally_form_id: kdP6do
  tally_form_revision: v6
  page_numbers: [5, 6, 7, 8, 9, 10]
  note: >-
    These six debug items are currently RU-only even if the respondent selected English
    for the first three multilingual prototype items.
  decision_model:
    - assigned
    - none_observed
    - abstained
  active_labels:
    - B.BLAME_CRITICISM
    - B.PRESSURE_FOR_CHANGE
    - B.VALIDATION
    - B.REPAIR_ATTEMPT
    - B.AVOIDANCE_TOPIC_SHIFT
  assigned_evidence_ui: >-
    One debug textarea. For every selected label, respondent writes
    LABEL = «shortest exact quote». This deliberately differs from the full one-field-per-label
    UX retained on prototype items 1-3.

items:
  - item_id: dg-10
    probe: blame_vs_specific_episode_or_causal_description
    messages:
      - author: a
        text: "Я ночью так замёрзла, кошмар."
      - author: b
        text: "Ну так вентилятор всю ночь работал, ты его не выключила."
        target: true
    design_note: >-
      Tests whether the current blame definition cleanly distinguishes a concrete episode
      and causal attribution from generalized/person-level criticism. No expected answer is
      frozen; disagreement may reveal an ontology contradiction.

  - item_id: dg-05
    probe: substantive_validation_vs_acknowledgement
    messages:
      - author: a
        text: "Мне было страшно одной ждать результаты обследования."
      - author: b
        text: "Одной такое ждать — ещё бы не страшно. Там любой бы дёргался."
        target: true
    design_note: >-
      Positive-boundary probe for substantive acknowledgement of the partner's experience,
      contrasted with bare acknowledgement such as «Понятно.»

  - item_id: dg-06
    probe: repair_deescalation_vs_avoidance
    messages:
      - author: a
        text: "Мы опять кричим друг на друга, это уже никуда не ведёт."
      - author: b
        text: "Стоп. Я злой сейчас, наговорю. Давай час, ну давай — я пройдусь, в девять вернусь, и нормально поговорим."
        target: true
    design_note: >-
      Tests the v5/v6 boundary that a concrete, explicitly bounded pause can be an observable
      repair/de-escalation move rather than avoidance.

  - item_id: dg-07
    probe: playful_insult_vs_blame_criticism
    messages:
      - author: a
        text: "Я случайно купил билеты не на тот день 🤦"
      - author: b
        text: "гений планирования 😂❤️ люблю тебя, катастрофа"
        target: true
    design_note: >-
      Tests whether affectionate/playful markers prevent automatic overcoding of criticism.

  - item_id: dg-08
    probe: sarcasm_with_insufficient_relational_context
    messages:
      - author: a
        text: "Я опять всё испортил."
      - author: b
        text: "Ну ты гений."
        target: true
    design_note: >-
      Deliberately under-contextualized sarcasm probe. Intended to exercise a genuine
      none_observed-vs-abstained boundary rather than reward guessing tone or intent.

  - item_id: dg-11
    probe: multilabel_repair_plus_pressure
    messages:
      - author: a
        text: "Ну да, перевод забыл. Знаю."
      - author: b
        text: "Ладно, орать я зря начала. Но поставь ты уже напоминалку на первое число, чтобы мне каждый месяц не писать."
        target: true
    design_note: >-
      Multi-label boundary probe: apology/taking responsibility co-occurs with an explicit
      demand for future behavior change. Tests whether «but» alone incorrectly cancels repair
      and whether pressure is distinguished from blame.

methodological_rule: >-
  Do not add expected labels after seeing a respondent's answer and then call them gold.
  If these cases are ever promoted into a scientific corpus, preregister/freeze their role,
  independently annotate them, and preserve this dogfood artifact as historical provenance.
